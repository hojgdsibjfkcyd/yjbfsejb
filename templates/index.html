<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل ساخت کانفیگ هوشمند</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- فونت وزیرمتن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <!-- کتابخانه کیوآرکد -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: 'Vazirmatn', sans-serif; }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 md:p-8 flex flex-col items-center justify-center">

    <div class="w-full max-w-2xl space-y-6">
        
        <!-- هدر -->
        <div class="glass rounded-3xl p-6 text-center shadow-2xl border border-slate-800">
            <h1 class="text-2xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 mb-2">
                ⚡ پنل هوشمند ساخت کانفیگ
            </h1>
            <p class="text-xs text-slate-400">تولید سریع کانفیگ‌های VLESS و تروجان همراه با لینک اشتراک (Sub)</p>
        </div>

        <!-- فرم دریافت اطلاعات -->
        <div class="glass rounded-3xl p-6 shadow-xl space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-2">🌐 آدرس دامنه / ورکر (بدون https):</label>
                <input type="text" id="domain" placeholder="example.workers.dev" 
                    class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">🎯 آی‌پی یا دامنه تمیز (اختیاری):</label>
                    <input type="text" id="clean_ip" placeholder="104.16.x.x" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">⚡ پروتکل:</label>
                    <select id="protocol" class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
                        <option value="vless">VLESS (پیش‌فرض)</option>
                        <option value="trojan">Trojan</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">🔑 شناسه UUID:</label>
                    <input type="text" id="uuid" placeholder="برای تولید خودکار خالی بگذارید" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-2">🏷️ نام کانفیگ (Remark):</label>
                    <input type="text" id="name" value="VPN-NewYork" 
                        class="w-full px-4 py-3 bg-slate-900 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
                </div>
            </div>

            <!-- دکمه ارسال -->
            <button onclick="createConfig()" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 text-white font-bold rounded-xl shadow-lg transition">
                🚀 تولید کانفیگ و لینک ساب
            </button>
        </div>

        <!-- باکس نمایش خروجی -->
        <div id="outputCard" class="hidden glass rounded-3xl p-6 shadow-xl space-y-4">
            <h3 class="text-sm font-bold text-cyan-400">کانفیگ‌های ساخته شده:</h3>
            <div id="configsList" class="space-y-3"></div>

            <div class="pt-4 border-t border-slate-700">
                <label class="block text-xs font-semibold text-slate-300 mb-2">🔗 لینک ساب (Subscription):</label>
                <div class="flex gap-2">
                    <input type="text" id="subLink" readonly 
                        class="w-full px-4 py-2.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-slate-300">
                    <button onclick="copySubLink()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-cyan-300 border border-slate-700 rounded-xl text-xs">کپی ساب</button>
                </div>
            </div>

            <div id="qrcodeModal" class="hidden flex flex-col items-center p-4 bg-slate-900 rounded-2xl border border-slate-800 mt-4">
                <div id="qrcode" class="p-2 bg-white rounded-xl"></div>
                <button onclick="closeQR()" class="mt-3 text-xs text-slate-400 hover:text-white">بستن QR Code</button>
            </div>
        </div>

    </div>

    <script>
        async function createConfig() {
            const domain = document.getElementById('domain').value.trim();
            const clean_ip = document.getElementById('clean_ip').value.trim();
            const uuid = document.getElementById('uuid').value.trim();
            const protocol = document.getElementById('protocol').value;
            const name = document.getElementById('name').value.trim();

            if (!domain) {
                alert('لطفاً آدرس ورکر یا دامنه را وارد کنید!');
                return;
            }

            try {
                const res = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ domain, clean_ip, uuid, protocol, name })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    const list = document.getElementById('configsList');
                    list.innerHTML = '';

                    data.configs.forEach(cfg => {
                        list.innerHTML += `
                            <div class="bg-slate-900 p-3 rounded-xl border border-slate-800 flex justify-between items-center gap-2">
                                <span class="text-[11px] text-slate-300 truncate w-3/4 font-mono select-all">${cfg}</span>
                                <div class="flex gap-1">
                                    <button onclick="navigator.clipboard.writeText('${cfg}'); alert('کانفیگ کپی شد!');" class="px-3 py-1 bg-cyan-600/30 text-cyan-300 text-xs rounded-lg hover:bg-cyan-600/50">کپی</button>
                                    <button onclick="showQR('${cfg}')" class="px-3 py-1 bg-blue-600/30 text-blue-300 text-xs rounded-lg hover:bg-blue-600/50">QR</button>
                                </div>
                            </div>
                        `;
                    });

                    const joined = data.configs.join('\n');
                    document.getElementById('subLink').value = `${window.location.origin}/sub?data=${encodeURIComponent(joined)}`;
                    document.getElementById('outputCard').classList.remove('hidden');
                }
            } catch (err) {
                alert('خطا در برقراری ارتباط با سرور!');
            }
        }

        function copySubLink() {
            navigator.clipboard.writeText(document.getElementById('subLink').value);
            alert('لینک ساب کپی شد! 📋');
        }

        let qrObj = null;
        function showQR(text) {
            const modal = document.getElementById('qrcodeModal');
            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = '';
            qrObj = new QRCode(qrDiv, { text: text, width: 140, height: 140 });
            modal.classList.remove('hidden');
        }

        function closeQR() {
            document.getElementById('qrcodeModal').classList.add('hidden');
        }
    </script>
</body>
</html>
