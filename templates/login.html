<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pablo Rail | ورود مدیریت</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
<style>
body { font-family: 'Vazirmatn', sans-serif; background: radial-gradient(circle at top, #1e293b, #020617); }
.glow { box-shadow: 0 0 50px rgba(14, 165, 233, 0.3); }
</style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

<div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl p-8 rounded-3xl border border-slate-700 glow">
  <div class="text-center mb-6">
    <div class="text-5xl mb-3">🚆</div>
    <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 to-blue-500">
      Pablo Rail
    </h1>
    <p class="text-xs text-slate-400 mt-2">پنل اختصاصی مدیریت کاربران</p>
  </div>

  {% if error %}
  <div class="bg-red-500/20 border border-red-500 text-red-300 text-xs p-3 rounded-xl mb-4 text-center">
    {{ error }}
  </div>
  {% endif %}

  <form method="POST" class="space-y-4">
    <div>
      <label class="block text-xs text-slate-300 mb-2">نام کاربری:</label>
      <input type="text" name="username" required
             class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
    </div>
    <div>
      <label class="block text-xs text-slate-300 mb-2">رمز عبور:</label>
      <input type="password" name="password" required
             class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl focus:outline-none focus:border-cyan-400 text-sm">
    </div>
    <button type="submit"
            class="w-full py-3 bg-gradient-to-r from-cyan-500 to-blue-600 hover:opacity-90 text-white font-bold rounded-xl transition">
      ورود به پنل
    </button>
  </form>

  <p class="text-center text-[11px] text-slate-500 mt-6">
    ساخته شده توسط <span class="text-cyan-400 font-bold">Abolfazl Pablo</span> ❤️
  </p>
</div>
</body>
</html>
